UntimedTranslationSectionDTO:
  title: UntimedTranslationSectionDTO
  type: object
  additionalProperties: false
  required: [id, text]
  properties:
    id:
      type: string
      minLength: 1
      description: Opaque ID unique within this exact request/source snapshot; never derive association from lyric text or response order.
    text:
      type: string
      minLength: 1
      description: Original section text, including authored line breaks. The client retains authoritative originals and section/stanza structure.

UntimedTranslationRequestDTO:
  title: UntimedTranslationRequestDTO
  type: object
  additionalProperties: false
  description: |
    Timestamp-free input shared by Firebase AI Logic untimed templates and the
    translateUntimed callable. Sections are in source order with unique IDs.
    Request validators must reject duplicate or blank IDs, blank source text,
    and invalid target language. Blank separators remain client-side; a section
    may contain multiple original lines. Never fabricate timestamps.
  required: [sections, targetLanguage]
  properties:
    sections:
      type: array
      minItems: 1
      items:
        $ref: "#/UntimedTranslationSectionDTO"
    targetLanguage:
      type: string
      minLength: 1
      description: Canonical target language tag selected by the client, echoed exactly in each response language. Providers must not silently substitute a locale.
      example: zh-Hant

UntimedTranslatedSectionDTO:
  title: UntimedTranslatedSectionDTO
  type: object
  additionalProperties: false
  required: [sectionId, language, text]
  properties:
    sectionId:
      type: string
      minLength: 1
      description: Exact ID from the corresponding request, independent of response ordering or duplicate source text.
    language:
      type: string
      minLength: 1
      description: Exact targetLanguage from the request.
    text:
      type: string
      minLength: 1
      description: Translated section text, preserving meaningful line breaks. Whitespace-only translations are unusable.

UntimedTranslationResponseDTO:
  title: UntimedTranslationResponseDTO
  type: object
  additionalProperties: false
  description: |
    Backend and consumer must reject the whole result for unknown IDs, duplicate
    IDs, wrong language, malformed entries or blank translated text. IDs may be
    omitted; the client shows the original section in every layout, including
    translation-only. Order is irrelevant. Originals and structural separators
    remain client authoritative. An empty list is representable but is not a
    successful translation and must not populate the translation cache. These
    cross-request rules require runtime validation; generated DTO parsing alone
    does not enforce them.
  required: [translations]
  properties:
    translations:
      type: array
      items:
        $ref: "#/UntimedTranslatedSectionDTO"

TranslateUntimedRequestDTO:
  title: TranslateUntimedRequestDTO
  type: object
  additionalProperties: false
  description: |
    Request data for the additive translateUntimed Firebase callable. The response
    data is UntimedTranslationResponseDTO, with existing callable error semantics.
    Retains translator selection and existing auth/quota controls. The backend
    must validate explicit untimedTranslationId capability against its supported
    configuration; client-supplied selection alone cannot establish capability.
    Existing timed translate and AILogic LRC contracts remain unchanged.
  required: [request, translator]
  properties:
    request:
      $ref: "#/UntimedTranslationRequestDTO"
    translator:
      $ref: "./feature_flag.yaml#/AITranslator"
